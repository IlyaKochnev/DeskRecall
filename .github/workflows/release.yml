name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Apple Silicon archive
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ARCHIVE: DeskRecall-macOS-arm64.zip
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check architecture and release version
        run: |
          test "$(uname -m)" = arm64
          swift --version
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "Tag must match the app version: v$version" >&2
              exit 1
            fi
          fi

      - name: Run checks and build app
        run: |
          scripts/test.sh
          scripts/build-app.sh release

      - name: Package and verify archive
        run: |
          test "$(lipo -archs dist/DeskRecall.app/Contents/MacOS/DeskRecall)" = arm64
          ditto -c -k --keepParent dist/DeskRecall.app "dist/$ARCHIVE"
          unpacked=$(mktemp -d)
          ditto -x -k "dist/$ARCHIVE" "$unpacked"
          test -x "$unpacked/DeskRecall.app/Contents/MacOS/DeskRecall"
          codesign --verify --strict "$unpacked/DeskRecall.app"
          cd dist
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeskRecall-macOS-arm64
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DeskRecall-macOS-arm64

      - name: Publish verified archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c DeskRecall-macOS-arm64.zip.sha256
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DeskRecall $GITHUB_REF_NAME" \
            --generate-notes \
            DeskRecall-macOS-arm64.zip DeskRecall-macOS-arm64.zip.sha256
